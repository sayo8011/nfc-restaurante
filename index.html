<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gourmet Tap - Menú Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { brand: { 500: '#f97316', 600: '#ea580c', 700: '#c2410c' } }
        }
      }
    }
  </script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 selection:bg-brand-500 selection:text-white">

  <!-- Header del Cliente -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i class="fa-solid fa-utensils text-white text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white">Gourmet<span class="text-brand-500">Tap</span></h1>
          <p class="text-xs text-slate-400">Menú y Pedidos</p>
        </div>
      </div>
      <!-- Indicador de Mesa -->
      <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-300 flex items-center gap-1.5">
        <i class="fa-solid fa-chair text-brand-500"></i>
        <span>Mesa <span id="header-table-num">4</span></span>
      </div>
    </div>
  </header>

  <!-- Contenido Principal Cliente -->
  <main class="flex-1 overflow-y-auto px-4 py-5 pb-28 max-w-md mx-auto w-full">
    
    <!-- Banner -->
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 border border-slate-800 p-5 mb-5 shadow-xl">
      <div class="relative z-10">
        <span class="inline-flex items-center gap-1.5 bg-brand-500/10 border border-brand-500/30 text-brand-400 text-xs px-2.5 py-1 rounded-full font-medium mb-2">
          <i class="fa-solid fa-bolt"></i> Conectado por NFC
        </span>
        <h2 class="text-xl font-bold text-white mb-1">¡Hola, bienvenido! 👋</h2>
        <p class="text-xs text-slate-400">Selecciona tus platillos y envíalos directo a la cocina al instante.</p>
      </div>
    </div>

    <!-- Categorías -->
    <div class="flex gap-2 overflow-x-auto pb-3 mb-5 hide-scrollbar">
      <button onclick="filterCategory('todos')" class="cat-btn active bg-brand-500 text-white px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap shadow-md transition-all flex items-center gap-2">
        <i class="fa-solid fa-border-all"></i> Todos
      </button>
      <button onclick="filterCategory('hamburguesas')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-2">
        <i class="fa-solid fa-burger"></i> Hamburguesas
      </button>
      <button onclick="filterCategory('acompanantes')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-2">
        <i class="fa-solid fa-french-fries"></i> Entradas
      </button>
      <button onclick="filterCategory('bebidas')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-2">
        <i class="fa-solid fa-glass-water"></i> Bebidas
      </button>
    </div>

    <!-- Grid de Productos -->
    <div id="products-grid" class="grid grid-cols-1 gap-3.5"></div>
  </main>

  <!-- Barra Flotante de Carrito -->
  <div id="cart-floating-bar" class="fixed bottom-0 left-0 right-0 z-30 p-4 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 transform translate-y-full transition-transform duration-300">
    <div class="max-w-md mx-auto flex items-center justify-between gap-4">
      <div>
        <p class="text-xs text-slate-400">Total acumulado</p>
        <p id="cart-total-price" class="text-lg font-extrabold text-white">$0.00</p>
      </div>
      <button onclick="openCartModal()" class="flex-1 bg-gradient-to-r from-brand-600 to-amber-500 hover:from-brand-500 hover:to-amber-400 text-white font-bold py-3 px-5 rounded-xl shadow-lg shadow-brand-500/25 flex items-center justify-center gap-2 text-sm transition-all active:scale-95">
        <i class="fa-solid fa-basket-shopping"></i>
        <span>Ver Pedido</span>
        <span id="cart-count-badge" class="bg-white text-slate-950 text-xs px-2 py-0.5 rounded-full font-black">0</span>
      </button>
    </div>
  </div>

  <!-- Modal del Carrito / Pedido -->
  <div id="cart-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300 max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
        <h3 class="font-bold text-lg text-white flex items-center gap-2">
          <i class="fa-solid fa-utensils text-brand-500"></i> Tu Pedido - Mesa <span id="modal-table-num">4</span>
        </h3>
        <button onclick="closeCartModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="cart-items-list" class="flex-1 overflow-y-auto space-y-3 pr-1 mb-4"></div>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Notas especiales:</label>
        <input type="text" id="order-notes" placeholder="Ej: Sin cebolla, extra salsa..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
      </div>
      <div class="pt-3 border-t border-slate-800">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm text-slate-400">Total:</span>
          <span id="cart-modal-total" class="text-xl font-black text-white">$0.00</span>
        </div>
        <button onclick="submitOrder()" class="w-full bg-gradient-to-r from-brand-600 to-amber-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2 text-sm transition active:scale-98">
          <i class="fa-solid fa-paper-plane"></i> Confirmar y Enviar a Cocina
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Éxito -->
  <div id="success-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 max-w-sm w-full rounded-3xl p-8 text-center shadow-2xl">
      <div class="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center mx-auto mb-4 animate-bounce">
        <i class="fa-solid fa-circle-check text-4xl"></i>
      </div>
      <h3 class="text-xl font-black text-white mb-2">¡Pedido Exitoso!</h3>
      <p class="text-xs text-slate-400 mb-6">Tu orden fue enviada a la cocina de inmediato.</p>
      <button onclick="closeSuccessModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs transition">
        Seguir viendo el menú
      </button>
    </div>
  </div>

  <script>
    const PRODUCTS = [
      { id: 'h1', name: 'Hamburguesa Trilogía Cheddar', category: 'hamburguesas', price: 12.90, description: '200g carne angus, triple cheddar, tocineta y salsa ahumada.', image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80' },
      { id: 'h2', name: 'Burger Trufada & Champíñon', category: 'hamburguesas', price: 14.50, description: 'Carne artesanal, mayonesa de trufa negra y champiñones.', image: 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=400&q=80' },
      { id: 'a1', name: 'Papas Rústicas Crunch', category: 'acompanantes', price: 5.50, description: 'Sazonadas con romero, paprika y alioli de la casa.', image: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=400&q=80' },
      { id: 'a2', name: 'Tequeños Gourmet (6 uds)', category: 'acompanantes', price: 6.90, description: 'Queso de mano frito con salsa de maracuyá picante.', image: 'https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=400&q=80' },
      { id: 'b1', name: 'Limonada de Coco Menta', category: 'bebidas', price: 4.20, description: 'Leche de coco natural, limón y menta fresca.', image: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=400&q=80' },
      { id: 'b2', name: 'Cerveza Artesanal IPA', category: 'bebidas', price: 5.00, description: 'Notas cítricas y 6.2% de alcohol.', image: 'https://images.unsplash.com/photo-1608270586620-248524c67de9?auto=format&fit=crop&w=400&q=80' }
    ];

    let currentTable = '4';
    let cart = [];
    const channel = new BroadcastChannel('gourmet_tap_orders_channel');

    window.addEventListener('DOMContentLoaded', () => {
      // Detectar si la URL trae parámetro de mesa ej: index.html?mesa=2
      const urlParams = new URLSearchParams(window.location.search);
      const mesaParam = urlParams.get('mesa');
      if (mesaParam) {
        currentTable = mesaParam;
      }
      document.getElementById('header-table-num').textContent = currentTable;
      document.getElementById('modal-table-num').textContent = currentTable;

      renderProducts('todos');
      updateCartUI();
    });

    function renderProducts(category) {
      const container = document.getElementById('products-grid');
      container.innerHTML = '';
      const filtered = category === 'todos' ? PRODUCTS : PRODUCTS.filter(p => p.category === category);

      filtered.forEach(product => {
        const itemCard = document.createElement('div');
        itemCard.className = 'bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex p-3.5 gap-3.5 shadow-md';
        itemCard.innerHTML = `
          <img src="${product.image}" class="w-24 h-24 rounded-xl object-cover flex-shrink-0 bg-slate-800">
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <h4 class="font-bold text-white text-sm leading-snug mb-1">${product.name}</h4>
              <p class="text-xs text-slate-400 line-clamp-2">${product.description}</p>
            </div>
            <div class="flex items-center justify-between mt-2">
              <span class="text-base font-extrabold text-brand-400">$${product.price.toFixed(2)}</span>
              <button onclick="addToCart('${product.id}')" class="bg-brand-500/10 hover:bg-brand-500 border border-brand-500/30 text-brand-400 hover:text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-plus"></i> Agregar
              </button>
            </div>
          </div>
        `;
        container.appendChild(itemCard);
      });
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-brand-500', 'text-white');
        btn.classList.add('bg-slate-900', 'border', 'border-slate-800', 'text-slate-400');
      });
      event.currentTarget.classList.remove('bg-slate-900', 'border', 'border-slate-800', 'text-slate-400');
      event.currentTarget.classList.add('bg-brand-500', 'text-white');
      renderProducts(cat);
    }

    function addToCart(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      const existing = cart.find(item => item.product.id === productId);
      if (existing) { existing.quantity++; } else { cart.push({ product, quantity: 1 }); }
      updateCartUI();
    }

    function updateQuantity(productId, delta) {
      const index = cart.findIndex(item => item.product.id === productId);
      if (index === -1) return;
      cart[index].quantity += delta;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      updateCartUI();
      renderCartModalItems();
    }

    function updateCartUI() {
      const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
      const totalPrice = cart.reduce((acc, item) => acc + (item.product.price * item.quantity), 0);
      const floatingBar = document.getElementById('cart-floating-bar');

      document.getElementById('cart-count-badge').textContent = totalItems;
      document.getElementById('cart-total-price').textContent = `$${totalPrice.toFixed(2)}`;

      if (totalItems > 0) {
        floatingBar.classList.remove('translate-y-full');
      } else {
        floatingBar.classList.add('translate-y-full');
        closeCartModal();
      }
    }

    function openCartModal() {
      if (cart.length === 0) return;
      renderCartModalItems();
      document.getElementById('cart-modal').classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.add('opacity-0', 'pointer-events-none');
    }

    function renderCartModalItems() {
      const container = document.getElementById('cart-items-list');
      container.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const subtotal = item.product.price * item.quantity;
        total += subtotal;
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800';
        row.innerHTML = `
          <div class="flex-1 pr-2">
            <h5 class="text-xs font-bold text-white">${item.product.name}</h5>
            <span class="text-[11px] text-brand-400 font-semibold">$${item.product.price.toFixed(2)} c/u</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg overflow-hidden">
              <button onclick="updateQuantity('${item.product.id}', -1)" class="px-2 py-1 text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-minus"></i></button>
              <span class="px-2 text-xs font-bold text-white">${item.quantity}</span>
              <button onclick="updateQuantity('${item.product.id}', 1)" class="px-2 py-1 text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-plus"></i></button>
            </div>
            <span class="text-xs font-bold text-white w-14 text-right">$${subtotal.toFixed(2)}</span>
          </div>
        `;
        container.appendChild(row);
      });
      document.getElementById('cart-modal-total').textContent = `$${total.toFixed(2)}`;
    }

    function submitOrder() {
      if (cart.length === 0) return;

      const orderNotes = document.getElementById('order-notes').value.trim();
      const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const newOrder = {
        id: orderId,
        table: `Mesa ${currentTable}`,
        time: timeStr,
        items: [...cart],
        notes: orderNotes,
        status: 'pending',
        total: cart.reduce((acc, item) => acc + (item.product.price * item.quantity), 0)
      };

      // Guardar en localStorage para que cocina.html lo reciba
      let savedOrders = JSON.parse(localStorage.getItem('gourmet_tap_orders') || '[]');
      savedOrders.unshift(newOrder);
      localStorage.setItem('gourmet_tap_orders', JSON.stringify(savedOrders));

      // Emitir canal broadcast en tiempo real
      channel.postMessage({ type: 'NEW_ORDER', order: newOrder });

      cart = [];
      document.getElementById('order-notes').value = '';
      updateCartUI();
      closeCartModal();

      document.getElementById('success-modal').classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeSuccessModal() {
      document.getElementById('success-modal').classList.add('opacity-0', 'pointer-events-none');
    }
  </script>
</body>
</html>
