<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gourmet Tap - Panel de Cocina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { brand: { 500: '#f97316', 600: '#ea580c', 700: '#c2410c' } }
        }
      }
    }
  </script>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 p-4 md:p-6">

  <!-- Header Cocina -->
  <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-800">
    <div>
      <h2 class="text-2xl font-black text-white flex items-center gap-3">
        <i class="fa-solid fa-kitchen-set text-brand-500"></i> Panel de Cocina & Comandas
      </h2>
      <p class="text-xs text-slate-400 mt-1">Este panel es privado. Las órdenes del NFC llegarán aquí automáticamente.</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs text-slate-300 flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
        <span>Escuchando Pedidos</span>
      </div>
      <button onclick="clearAllOrders()" class="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 px-3 py-2 rounded-xl transition hover:bg-rose-500/20">
        <i class="fa-solid fa-trash-can"></i> Limpiar Historial
      </button>
    </div>
  </header>

  <!-- Estadísticas -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <p class="text-xs text-slate-400 mb-1">Total Pedidos</p>
      <p id="stat-total" class="text-2xl font-bold text-white">0</p>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <p class="text-xs text-amber-400 mb-1">En Espera</p>
      <p id="stat-pending" class="text-2xl font-bold text-amber-400">0</p>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <p class="text-xs text-blue-400 mb-1">En Preparación</p>
      <p id="stat-preparing" class="text-2xl font-bold text-blue-400">0</p>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <p class="text-xs text-emerald-400 mb-1">Completados</p>
      <p id="stat-ready" class="text-2xl font-bold text-emerald-400">0</p>
    </div>
  </div>

  <!-- Contenedor de Comandas -->
  <div id="kitchen-orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 flex-1 overflow-y-auto pb-6"></div>

  <!-- Estado Vacío -->
  <div id="kitchen-empty-state" class="hidden text-center py-20 bg-slate-900/50 border border-dashed border-slate-800 rounded-3xl m-auto max-w-md w-full">
    <div class="w-16 h-16 rounded-2xl bg-slate-800 text-slate-600 flex items-center justify-center mx-auto mb-4 text-2xl">
      <i class="fa-solid fa-receipt"></i>
    </div>
    <h3 class="text-lg font-bold text-slate-300 mb-1">No hay pedidos activos</h3>
    <p class="text-xs text-slate-500">Los pedidos realizados mediante NFC aparecerán aquí al instante.</p>
  </div>

  <script>
    let orders = [];
    const channel = new BroadcastChannel('gourmet_tap_orders_channel');

    window.addEventListener('DOMContentLoaded', () => {
      loadOrders();
      renderKitchenOrders();

      channel.onmessage = (event) => {
        if (event.data && event.data.type === 'NEW_ORDER') {
          orders.unshift(event.data.order);
          saveOrders();
          renderKitchenOrders();
          playKitchenNotificationSound();
        }
      };

      window.addEventListener('storage', (e) => {
        if (e.key === 'gourmet_tap_orders') {
          loadOrders();
          renderKitchenOrders();
        }
      });
    });

    function loadOrders() {
      orders = JSON.parse(localStorage.getItem('gourmet_tap_orders') || '[]');
    }

    function saveOrders() {
      localStorage.setItem('gourmet_tap_orders', JSON.stringify(orders));
    }

    function renderKitchenOrders() {
      const container = document.getElementById('kitchen-orders-container');
      const emptyState = document.getElementById('kitchen-empty-state');
      container.innerHTML = '';

      let total = orders.length;
      let pending = orders.filter(o => o.status === 'pending').length;
      let preparing = orders.filter(o => o.status === 'preparing').length;
      let ready = orders.filter(o => o.status === 'ready').length;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-preparing').textContent = preparing;
      document.getElementById('stat-ready').textContent = ready;

      if (orders.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      orders.forEach(order => {
        const card = document.createElement('div');
        card.className = `bg-slate-900 border rounded-2xl p-4 flex flex-col justify-between shadow-xl transition ${
          order.status === 'pending' ? 'border-amber-500/50' : order.status === 'preparing' ? 'border-blue-500/50' : 'border-emerald-500/50'
        }`;

        let statusBadge = '';
        if (order.status === 'pending') statusBadge = '<span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">En Espera</span>';
        else if (order.status === 'preparing') statusBadge = '<span class="bg-blue-500/10 text-blue-400 border border-blue-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">En Preparación</span>';
        else statusBadge = '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">Completado</span>';

        let itemsHtml = order.items.map(i => `
          <div class="flex justify-between text-xs py-1 border-b border-slate-800/60">
            <span class="text-slate-300 font-medium"><strong class="text-brand-400">${i.quantity}x</strong> ${i.product.name}</span>
            <span class="text-slate-400">$${(i.product.price * i.quantity).toFixed(2)}</span>
          </div>
        `).join('');

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="font-black text-white text-base">${order.table}</span>
              ${statusBadge}
            </div>
            <div class="flex justify-between items-center text-xs text-slate-400 mb-3 bg-slate-950 p-2 rounded-xl">
              <span><i class="fa-solid fa-hashtag text-brand-500"></i> ${order.id}</span>
              <span><i class="fa-regular fa-clock"></i> ${order.time}</span>
            </div>
            <div class="space-y-1 mb-3">${itemsHtml}</div>
            ${order.notes ? `<div class="bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs p-2 rounded-xl mb-3"><strong>Nota:</strong> ${order.notes}</div>` : ''}
          </div>
          <div>
            <div class="flex justify-between items-center pt-3 border-t border-slate-800 mb-3">
              <span class="text-xs text-slate-400 font-semibold">Total Orden:</span>
              <span class="text-sm font-black text-white">$${order.total.toFixed(2)}</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
              <button onclick="updateOrderStatus('${order.id}', 'pending')" class="py-1.5 rounded-lg text-[10px] font-bold transition ${order.status === 'pending' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400 hover:text-white'}">Espera</button>
              <button onclick="updateOrderStatus('${order.id}', 'preparing')" class="py-1.5 rounded-lg text-[10px] font-bold transition ${order.status === 'preparing' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}">Proceso</button>
              <button onclick="updateOrderStatus('${order.id}', 'ready')" class="py-1.5 rounded-lg text-[10px] font-bold transition ${order.status === 'ready' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}">Listo</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateOrderStatus(orderId, newStatus) {
      const idx = orders.findIndex(o => o.id === orderId);
      if (idx !== -1) {
        orders[idx].status = newStatus;
        saveOrders();
        renderKitchenOrders();
      }
    }

    function clearAllOrders() {
      if (confirm('¿Deseas limpiar todo el historial de comandas?')) {
        orders = [];
        saveOrders();
        renderKitchenOrders();
      }
    }

    function playKitchenNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }
  </script>
</body>
</html>
