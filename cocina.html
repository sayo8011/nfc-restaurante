<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Cocina - Gourmet Tap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { brand: { 500: '#f97316', 600: '#ea580c', 700: '#c2410c' } }
        }
      }
    }
  </script>
</head>
<body class="min-h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 p-6">

  <!-- Header Cocina -->
  <header class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center shadow-lg">
        <i class="fa-solid fa-fire-burner text-white"></i>
      </div>
      <div>
        <h1 class="font-black text-lg text-white">Panel de Cocina & Comandas</h1>
        <p class="text-xs text-slate-400">Sincronizado en tiempo real con Firebase Firestore.</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-3 py-1.5 rounded-xl font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> En Línea
      </span>
    </div>
  </header>

  <!-- Métricas rápidas -->
  <div class="grid grid-cols-3 gap-4 mb-6 max-w-4xl">
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <p class="text-xs text-slate-400">Total Pedidos</p>
      <h3 id="stat-total" class="text-2xl font-black text-white">0</h3>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <p class="text-xs text-amber-400">Pendientes</p>
      <h3 id="stat-pending" class="text-2xl font-black text-white">0</h3>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <p class="text-xs text-emerald-400">Completados</p>
      <h3 id="stat-completed" class="text-2xl font-black text-white">0</h3>
    </div>
  </div>

  <!-- Contenedor de Órdenes -->
  <main class="flex-1">
    <h2 class="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider">Órdenes Entrantes</h2>
    <div id="kitchen-orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div id="empty-state" class="col-span-full py-16 text-center border-2 border-dashed border-slate-800 rounded-3xl">
        <i class="fa-solid fa-receipt text-4xl text-slate-600 mb-3"></i>
        <h3 class="text-sm font-bold text-slate-400">No hay pedidos activos</h3>
        <p class="text-xs text-slate-600 mt-1">Los pedidos realizados desde las mesas aparecerán aquí al instante.</p>
      </div>
    </div>
  </main>

  <!-- FIREBASE LISTENER -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBkY9Hthp4DBfg5fDRul2A5ReQhwBE00LM",
      authDomain: "prueba-con-nfc.firebaseapp.com",
      projectId: "prueba-con-nfc",
      storageBucket: "prueba-con-nfc.firebasestorage.app",
      messagingSenderId: "239772271725",
      appId: "1:239772271725:web:e151be1bcff1ae864e6b64",
      measurementId: "G-2XW0MG6H10"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ordersGrid = document.getElementById('kitchen-orders-grid');
    const emptyState = document.getElementById('empty-state');
    const statTotal = document.getElementById('stat-total');
    const statPending = document.getElementById('stat-pending');
    const statCompleted = document.getElementById('stat-completed');

    const q = query(collection(db, "orders"));
    
    onSnapshot(q, (snapshot) => {
      ordersGrid.innerHTML = '';
      let orders = [];
      
      snapshot.forEach((docSnap) => {
        orders.push({ id: docSnap.id, ...docSnap.data() });
      });

      if (orders.length === 0) {
        ordersGrid.appendChild(emptyState);
        statTotal.textContent = '0';
        statPending.textContent = '0';
        statCompleted.textContent = '0';
        return;
      }

      statTotal.textContent = orders.length;
      statPending.textContent = orders.filter(o => o.status === 'pending').length;
      statCompleted.textContent = orders.filter(o => o.status === 'completed').length;

      orders.forEach(order => {
        const card = document.createElement('div');
        const isCompleted = order.status === 'completed';
        
        card.className = `bg-slate-900 border rounded-3xl p-5 flex flex-col justify-between shadow-xl transition-all ${isCompleted ? 'border-emerald-500/30 opacity-70' : 'border-slate-800'}`;
        
        let itemsHtml = order.items.map(i => `
          <div class="flex justify-between items-center text-xs py-1 border-b border-slate-800/50">
            <span class="text-slate-300"><strong class="text-brand-400 font-extrabold">${i.quantity}x</strong> ${i.name}</span>
            <span class="text-slate-500">$${(i.price * i.quantity).toFixed(2)}</span>
          </div>
        `).join('');

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-3">
              <span class="bg-brand-500/10 text-brand-400 border border-brand-500/30 text-xs px-2.5 py-1 rounded-xl font-bold">
                <i class="fa-solid fa-chair"></i> ${order.table}
              </span>
              <span class="text-xs text-slate-500"><i class="fa-regular fa-clock"></i> ${order.time}</span>
            </div>
            <div class="space-y-1 mb-4">
              ${itemsHtml}
            </div>
            ${order.notes ? `<div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-[11px] text-amber-300 mb-4"><i class="fa-solid fa-note-sticky"></i> <strong>Nota:</strong> ${order.notes}</div>` : ''}
          </div>
          <div class="flex gap-2 pt-2 border-t border-slate-800">
            ${!isCompleted ? 
              `<button onclick="completeOrder('${order.id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs transition">Completar</button>` : 
              `<span class="flex-1 text-center text-emerald-400 text-xs font-bold py-2"><i class="fa-solid fa-check-circle"></i> Entregado</span>`
            }
            <button onclick="deleteOrder('${order.id}')" class="bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 px-3 py-2 rounded-xl text-xs transition"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        ordersGrid.appendChild(card);
      });
    });

    window.completeOrder = async function(orderId) {
      const orderRef = doc(db, "orders", orderId);
      await updateDoc(orderRef, { status: 'completed' });
    }

    window.deleteOrder = async function(orderId) {
      if (confirm('¿Eliminar este pedido del historial?')) {
        await deleteDoc(doc(db, "orders", orderId));
      }
    }
  </script>
</body>
</html>
